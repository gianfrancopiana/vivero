# Certified blue/green deploy example.
#
# Vivero plans the inactive slot and records the release lifecycle. The app repo
# owns slot discovery, prepare, smoke, promote, status, and rollback commands.
project:
  name: deploy-blue-green

services:
  web:
    image: registry.example.com/deploy-blue-green@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    port: 3000
    health:
      path: /
      timeout: 30s
    resources:
      cpus: '1'
      memory: 512m

deploy:
  environments:
    production:
      strategy: blue-green
      blueGreen:
        slots: [blue, green]
        activeSlotCommand: sh scripts/blue-green.sh active-slot
        prepareCommand: sh scripts/blue-green.sh prepare
        smokeCommand: sh scripts/blue-green.sh smoke
        promoteCommand: sh scripts/blue-green.sh promote
        statusCommand: sh scripts/blue-green.sh status
        rollbackCommand: sh scripts/blue-green.sh rollback
