# Gumroad container preview example.
#
# Vivero owns the app container and backing service containers. This bundled
# example keeps the preview runtime inline as a fixture; in a real app repo,
# prefer pointing at an existing Dockerfile or a prebuilt image when possible.
project:
  name: gumroad-main

sources:
  gumroad:
    mode: external
    path: ~/src/gumroad
    defaultRef: main

warm:
  baselineRefs: [main]
  fingerprint:
    paths:
      - Gemfile.lock
      - package-lock.json
      - db/migrate
      - db/schema.rb
      - db/seeds.rb

backingServices:
  db:
    image: mysql:8.0.32
    env:
      MYSQL_ROOT_PASSWORD: password
    dependencyVolumes:
      - name: mysql_data
        target: /var/lib/mysql
        lifetime: smart
    health:
      command: mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent
      timeout: 2m
      interval: 2s
  elasticsearch:
    image: elasticsearch:7.9.3
    env:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    dependencyVolumes:
      - name: elasticsearch7data
        target: /usr/share/elasticsearch/data
        lifetime: smart
    health:
      command: curl -fsS http://127.0.0.1:9200 >/dev/null
      timeout: 2m
      interval: 2s
  memcached:
    image: memcached:latest
  mongo:
    image: mongo:3.6.16
    dependencyVolumes:
      - name: mongo_data
        target: /data/db
        lifetime: smart
    health:
      command: "mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"
      timeout: 2m
      interval: 2s
  redis:
    image: redis:7.0.7
    dependencyVolumes:
      - name: redis_data
        target: /data
    health:
      command: redis-cli ping | grep PONG
      timeout: 2m
      interval: 2s

services:
  gumroad-web:
    source: gumroad
    runtime: docker
    build:
      context: .
      tag: vivero/gumroad-dev-runtime:3.4.3-node22
      dockerfileInline: |
        FROM ruby:3.4.3-slim-bullseye

        ENV BUNDLE_PATH=/bundle_path \
            APP_DIR=/app \
            LANG=C.UTF-8

        ARG DEBIAN_FRONTEND=noninteractive

        RUN mkdir -p /usr/share/man/man1 \
          && sed -i "s/bullseye main/bullseye main contrib non-free/" /etc/apt/sources.list \
          && apt-get update -y -qq \
          && apt-get install -yq --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            ffmpeg \
            fonts-dejavu \
            fonts-takao \
            fonts-wqy-microhei \
            fonts-wqy-zenhei \
            git \
            gnupg \
            imagemagick \
            jq \
            less \
            libcurl4-openssl-dev \
            libgcrypt20 \
            libjemalloc-dev \
            libjemalloc2 \
            liblzma-dev \
            libssl-dev \
            libtag1-dev \
            libvips-dev \
            libxml2-dev \
            libxrender1 \
            libyaml-dev \
            default-libmysqlclient-dev \
            percona-toolkit \
            pdftk \
            ruby-dev \
            screen \
            sudo \
            ttf-wqy-microhei \
            ttf-wqy-zenhei \
            unzip \
            wget \
            zlib1g-dev \
          && fc-cache -f -v \
          && mkdir -p /etc/apt/keyrings \
          && curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --batch --yes --dearmor -o /etc/apt/keyrings/nodesource.gpg \
          && echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list \
          && apt-get update -y -qq \
          && apt-get install -yq --no-install-recommends nodejs \
          && corepack enable \
          && gem install bundler:2.5.10 \
          && mkdir -p /bundle_path /app/tmp /app/log \
          && chmod -R 777 /bundle_path /app \
          && ln -sf "$(ldconfig -p | awk '/libjemalloc\.so\.2/ { print $NF; exit }')" /usr/local/lib/libjemalloc.so.2 \
          && apt-get clean autoclean \
          && rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*

        ENV LD_PRELOAD=/usr/local/lib/libjemalloc.so.2

        WORKDIR /app
    workingDir: .
    dependencyVolumes:
      - name: bundle_path
        target: /bundle_path
        lifetime: smart
      - name: node_modules
        target: /app/node_modules
        lifetime: smart
    env:
      BUNDLE_PATH: /bundle_path
      # grpc's native extension can OOM on Docker Desktop/OrbStack when it
      # auto-detects host CPU count and runs make -j10 inside the VM.
      GRPC_RUBY_BUILD_PROCS: "1"
      DATABASE_HOST: db
      DATABASE_NAME: gumroad_development
      DATABASE_PORT: "3306"
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: password
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      REDIS_HOST: redis:6379/0
      SIDEKIQ_REDIS_HOST: redis:6379/1
      RPUSH_REDIS_HOST: redis:6379/2
      RACK_ATTACK_REDIS_HOST: redis:6379/3
      MONGO_DATABASE_URL: mongo:27017
      MONGO_SECONDARY_DATABASE_URL: mongo:27017
      MONGO_DATABASE_NAME: gumroad_log_development
      MONGO_DATABASE_USERNAME: ""
      MONGO_DATABASE_PASSWORD: ""
      MONGO_REPLICA_SET: empty_replica_set
      MEMCACHE_SERVERS: memcached:11211
      RAILS_ENV: development
      RACK_ENV: development
      DISABLE_SPRING: "1"
      IN_DOCKER: "true"
      SKIP_NATIVE_MYSQL_RECONNECT: "true"
    # Vivero maps Gumroad's container port to a dynamic 127.0.0.1 host port,
    # so multiple previews can run concurrently without fighting over 3310.
    command: rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0 -p 3310
    ports:
      http:
        container: 3310
    primaryPort: http
    # Gumroad's dev routes are host-constrained. `localhost` shows the public
    # marketing homepage while still allowing /login and app routes.
    originHost: localhost
    tunnelHostHeader: localhost
    public: false
    publicRewrite:
      origins:
        - http://localhost:3000
        - http://localhost:3310
        - http://app.localhost:3000
        - http://api.localhost:3000
        - http://s.localhost:3000
        - http://analytics.localhost:3000
      hosts:
        - localhost:3000
        - localhost:3310
        - app.localhost:3000
        - api.localhost:3000
        - s.localhost:3000
        - analytics.localhost:3000
      replacements:
        - from: '&quot;scheme&quot;:&quot;http&quot;'
          to: '&quot;scheme&quot;:&quot;{publicScheme}&quot;'
        - from: '"scheme":"http"'
          to: '"scheme":"{publicScheme}"'
    health:
      path: /
      expectStatus: 200
      timeout: 2m
      interval: 2s

setup:
  afterSeeds:
    - service: gumroad-web
      command: bundle install && bundle exec rails db:prepare
    - service: gumroad-web
      policy: once-per-project
      command: >-
        bundle exec rails runner 'load Rails.root.join("db/seeds/020_development_staging/gumroad_posts.rb") unless User.exists?(username: "gumroad")'
    - service: gumroad-web
      # Gumroad main can emit usable packs while ForkTsChecker exits nonzero on
      # existing TypeScript errors. Keep previews health-gated on HTTP instead
      # of blocking on that checker when a manifest was still produced.
      command: npm install && bundle exec rails js:export && (npm run build || test -f public/packs/manifest.json)
    - service: gumroad-web
      policy: once-per-project
      command: >-
        bundle exec rails runner 'DevTools.delete_all_indices_and_reindex_all'

agent:
  defaultPreviewService: gumroad-web
  screenshotBreakpoints:
    - name: desktop
      width: 1440
      height: 900
    - name: tablet
      width: 834
      height: 1112
    - name: mobile
      width: 390
      height: 844
  commonPages:
    home:
      service: gumroad-web
      path: /
    login:
      service: gumroad-web
      path: /login
    blog:
      service: gumroad-web
      path: /blog
    products:
      service: gumroad-web
      path: /products
  smokeTests:
    - name: homepage
      service: gumroad-web
      path: /
      expectStatus: 200
    - name: login
      service: gumroad-web
      path: /login
      expectStatus: 200
    - name: blog
      service: gumroad-web
      path: /blog
      expectStatus: 200
  qa:
    defaultScope: public-preview
    artifactRoot: ~/.vivero/qa/gumroad
    driver:
      preferred: playwright
      evidence: playwright
      exploratory: chrome-mcp
      allowed:
        - playwright
        - browser
        - chrome-mcp
      notes: >-
        Vivero owns preview context, smoke checks, screenshots, recordings,
        traces, and artifact paths through Playwright. Chrome MCP is reserved
        for exploratory agent debugging against a live browser session.
    evidence:
      screenshots:
        colorSchemes:
          - light
          - dark
      recordings:
        colorSchemes:
          - light
    scopes:
      - name: gumroad-core
        description: >-
          Core Gumroad QA surface for public preview rewriting, public pages, and the
          authenticated products area when the operator agent has a valid browser session.
        pages:
          - home
          - login
          - blog
          - products
        checks:
          - name: smoke-tests-pass
            category: runtime
            severity: critical
            method: vivero-smoke
            description: Run the project-declared HTTP smoke tests before browser QA.
          - name: no-console-errors
            category: browser
            severity: high
            method: browser-console
            description: Fail on uncaught exceptions, severe console errors, or mixed-content blocks.
          - name: no-network-failures
            category: browser
            severity: high
            method: browser-network
            description: Inspect failed document/script/fetch/XHR requests on visited pages.
          - name: responsive-breakpoints
            category: visual
            severity: medium
            method: vivero-screenshot-breakpoints
            description: Capture desktop, tablet, and mobile viewport evidence with Vivero.
          - name: public-preview-origin-rewrite
            category: preview
            severity: high
            method: browser-url-inspection
            description: Public tunnel navigation should stay on the public preview host and HTTPS scheme.
        flows:
          - name: public-navigation
            description: Public pages render and link without leaking localhost origins.
            start: home
            steps:
              - visit: home
              - expectText: Gumroad
              - visit: login
              - expectText: Log in
              - visit: blog
              - expectText: Gumroad
              - screenshot: public-navigation
          - name: authenticated-products
            description: >-
              If an authenticated browser session is available, verify the products
              dashboard renders and core navigation stays inside the preview host.
            start: products
            steps:
              - visit: products
              - expectUrl: /products
              - screenshot: authenticated-products
      - name: public-preview
        description: Public unauthenticated preview checks safe to run without a stored login.
        pages:
          - home
          - login
          - blog
        flows:
          - name: marketplace-search-feature-qa
            description: >-
              Example feature QA flow for a public Gumroad marketplace/search change.
              It exercises the local preview, checks expected copy, fills the search box,
              and captures evidence without adding any demo web UI.
            start: home
            steps:
              - visit: home
              - expectText: Gumroad
              - expectText: Go from
              - fill: '#marketplace-search'
                value: writing
              - screenshot: marketplace-search-feature-qa
        checks:
          - name: smoke-tests-pass
            category: runtime
            severity: critical
            method: vivero-smoke
          - name: no-localhost-links
            category: preview
            severity: high
            method: browser-dom-inspection
            description: Rendered links, forms, fetch/XHR calls, and beacons should target the public preview host.
  iteration:
    restartCommand:
      service: gumroad-web
      command: touch tmp/restart.txt
    dependencyChangedCommand:
      service: gumroad-web
      command: bundle install && npm install
