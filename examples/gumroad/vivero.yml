# Gumroad preview fixture.
#
# Vivero owns preview orchestration: source selection, dynamic ports, public URL
# rewriting, health checks, and QA evidence. Gumroad owns runtime assets:
# images, Compose topology, dependency services, env contracts, volumes, setup,
# and boot behavior. Keep this file thin by delegating runtime to one
# app-owned Compose service.
project:
  name: gumroad-main

sources:
  gumroad:
    mode: external
    path: ~/src/gumroad
    defaultRef: main

services:
  gumroad-web:
    source: gumroad
    runtime: compose
    compose:
      file: docker/docker-compose-vivero-preview.yml
      service: gumroad-web
    ports:
      http:
        container: 3310
    primaryPort: http
    # Gumroad's dev routes are host-constrained. `localhost` shows the public
    # marketing homepage while still allowing /login and app routes.
    originHost: localhost
    tunnelHostHeader: localhost
    public: false
    publicRewrite:
      origins:
        - http://localhost:3000
        - http://localhost:3310
        - http://app.localhost:3000
        - http://api.localhost:3000
        - http://s.localhost:3000
        - http://analytics.localhost:3000
      hosts:
        - localhost:3000
        - localhost:3310
        - app.localhost:3000
        - api.localhost:3000
        - s.localhost:3000
        - analytics.localhost:3000
      replacements:
        - from: '&quot;scheme&quot;:&quot;http&quot;'
          to: '&quot;scheme&quot;:&quot;{publicScheme}&quot;'
        - from: '"scheme":"http"'
          to: '"scheme":"{publicScheme}"'
    health:
      path: /
      expectStatus: 200
      timeout: 10m
      interval: 2s

agent:
  defaultPreviewService: gumroad-web
  screenshotBreakpoints:
    - name: desktop
      width: 1440
      height: 900
    - name: mobile
      width: 390
      height: 844
  commonPages:
    home:
      service: gumroad-web
      path: /
    login:
      service: gumroad-web
      path: /login
    blog:
      service: gumroad-web
      path: /blog
    products:
      service: gumroad-web
      path: /products
  smokeTests:
    - name: homepage
      service: gumroad-web
      path: /
      expectStatus: 200
    - name: login
      service: gumroad-web
      path: /login
      expectStatus: 200
    - name: blog
      service: gumroad-web
      path: /blog
      expectStatus: 200
  qa:
    defaultScope: public-preview
    artifactRoot: ~/.vivero/qa/gumroad
    evidence:
      screenshots:
        colorSchemes:
          - light
          - dark
    scopes:
      - name: public-preview
        pages:
          - home
          - login
          - blog
        checks:
          - name: smoke-tests-pass
            category: runtime
            severity: critical
            method: vivero-smoke
          - name: no-localhost-links
            category: preview
            severity: high
            method: browser-dom-inspection
